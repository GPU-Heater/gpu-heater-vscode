<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU-Heater Coder</title>

    <link rel="stylesheet" href="codicon.min.css">
    <script src="marked.min.js"></script>

    <style>
        :root {
            --idea-bg: #2b2b2b;
            --idea-fg: #a9b7c6;
            --idea-input-bg: #3c3f41;
            --accent: #38bdf8;
            --border: #4d4d4d;
        }
        body {
            font-family: 'JetBrains Mono', 'Segoe UI', sans-serif;
            background-color: var(--idea-bg);
            color: var(--idea-fg);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 0;
            overflow: hidden;
        }
        .top-header {
            display: flex;
            justify-content: flex-end;
            padding: 4px 8px;
            background: rgba(0,0,0,0.1);
            border-bottom: 1px solid var(--border);
        }
        .lang-select {
            background: var(--idea-input-bg);
            color: var(--idea-fg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 11px;
            outline: none;
            cursor: pointer;
        }
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            color: var(--idea-fg);
            border: none;
            padding: 10px 0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            opacity: 0.6;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn:hover { opacity: 1; background: rgba(255,255,255,0.05); }
        .tab-btn.active {
            opacity: 1;
            border-bottom: 2px solid var(--accent);
            color: var(--accent);
        }
        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow-y: auto;
        }
        .tab-content.active { display: flex; }
        .toggles-area {
            padding: 8px 10px; background: rgba(0, 0, 0, 0.1); border-bottom: 1px solid var(--border);
            display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px;
        }
        .toggle-item { display: flex; align-items: center; gap: 6px; }
        .switch { position: relative; display: inline-block; width: 28px; height: 16px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--idea-input-bg); transition: .2s; border-radius: 16px; border: 1px solid var(--border);
        }
        .slider:before {
            position: absolute; content: ""; height: 10px; width: 10px; left: 2px; bottom: 2px;
            background-color: var(--idea-fg); transition: .2s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(12px); background-color: #fff;}
        input:disabled + .slider { cursor: not-allowed; opacity: 0.7; }

        .context-bar {
            padding: 6px 10px; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; font-size: 11px; gap: 6px;
        }
        .context-select {
            background: var(--idea-input-bg);
            color: var(--idea-fg);
            border: 1px solid var(--border);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            width: auto;
            margin-bottom: 0;
        }

        .chat-history { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5; word-wrap: break-word; }
        .user-msg { background: rgba(56, 189, 248, 0.15); border-left: 3px solid var(--accent); align-self: flex-end; width: 85%; }
        .bot-msg { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); align-self: flex-start; width: 95%; }

        .markdown-body pre { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; overflow-x: auto; }
        .markdown-body code { font-family: 'Consolas', monospace; font-size: 12px; color: var(--accent); }

        .input-area, .panel-area { padding: 10px; border-top: 1px solid var(--border); background: var(--idea-bg); flex-shrink: 0;}
        textarea, input, select {
            width: 100%; background: var(--idea-input-bg); color: var(--idea-fg);
            border: 1px solid var(--border); padding: 8px; border-radius: 4px; font-family: inherit;
            outline: none; box-sizing: border-box; font-size: 13px; margin-bottom: 8px;
        }
        textarea:focus, input:focus { border-color: var(--accent); }
        button.btn {
            width: 100%; padding: 8px; background: var(--accent); color: #fff;
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 5px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button.btn:hover { background: #0284c7; }
        button.btn-sec { background: transparent; border: 1px solid var(--border); color: var(--idea-fg); }
        button.btn-sec:hover { background: rgba(255,255,255,0.1); }
        button.btn-danger { background: #ef4444; }

        .panel-content { padding: 15px; flex: 1; overflow-y: auto; font-size: 13px; }
        .git-item { display: flex; gap: 10px; padding: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .git-status-code { font-weight: bold; color: var(--accent); width: 25px; }

        .codicon-spin {
            animation: spin 1.5s infinite linear;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(359deg); }
        }
    </style>
</head>
<body>
<div class="top-header">
    <select class="lang-select" id="uiLangSelect" onchange="changeLanguage(this.value)">
        <option value="ar">العربية (Arabic)</option>
        <option value="az">Azərbaycanca (Azerbaijani)</option>
        <option value="bg">Български (Bulgarian)</option>
        <option value="bn">বাংলা (Bengali)</option>
        <option value="cs">Čeština (Czech)</option>
        <option value="da">Dansk (Danish)</option>
        <option value="de">Deutsch (German)</option>
        <option value="el">Ελληνικά (Greek)</option>
        <option value="en" selected>English (English)</option>
        <option value="es">Español (Spanish)</option>
        <option value="fa">فارسی (Persian)</option>
        <option value="fi">Suomi (Finnish)</option>
        <option value="fr">Français (French)</option>
        <option value="he">עברית (Hebrew)</option>
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="hu">Magyar (Hungarian)</option>
        <option value="id">Bahasa Indonesia (Indonesian)</option>
        <option value="it">Italiano (Italian)</option>
        <option value="ja">日本語 (Japanese)</option>
        <option value="kk">Қазақша (Kazakh)</option>
        <option value="ko">한국어 (Korean)</option>
        <option value="ms">Bahasa Melayu (Malay)</option>
        <option value="nl">Nederlands (Dutch)</option>
        <option value="no">Norsk (Norwegian)</option>
        <option value="pl">Polski (Polish)</option>
        <option value="pt">Português (Portuguese)</option>
        <option value="ro">Română (Romanian)</option>
        <option value="ru">Русский (Russian)</option>
        <option value="sk">Slovenčina (Slovak)</option>
        <option value="sr">Српски (Serbian)</option>
        <option value="sv">Svenska (Swedish)</option>
        <option value="sw">Kiswahili (Swahili)</option>
        <option value="th">ไทย (Thai)</option>
        <option value="tr">Türkçe (Turkish)</option>
        <option value="uk">Українська (Ukrainian)</option>
        <option value="ur">اردو (Urdu)</option>
        <option value="uz">O'zbekcha (Uzbek)</option>
        <option value="vi">Tiếng Việt (Vietnamese)</option>
        <option value="zh">中文 (Chinese)</option>
        <option value="zh-TW">繁體中文 (Traditional Chinese)</option>
    </select>
</div>
<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('chat', event)">
        <i class="codicon codicon-comment-discussion"></i> <span data-i18n="tab_chat">Chat</span>
    </button>
    <button class="tab-btn" onclick="switchTab('project', event)">
        <i class="codicon codicon-folder-opened"></i> <span data-i18n="tab_project">Project</span>
    </button>
    <button class="tab-btn" onclick="switchTab('git', event)">
        <i class="codicon codicon-source-control"></i> <span data-i18n="tab_git">Git</span>
    </button>
</div>

<div id="tab-chat" class="tab-content active">
    <div class="toggles-area">
        <div class="toggle-item"><label class="switch"><input type="checkbox" id="coderMode" checked><span class="slider"></span></label> <span data-i18n="coder_mode">Coder Mode</span></div>
        <div class="toggle-item"><label class="switch"><input type="checkbox" id="kbToggle"><span class="slider"></span></label> <span data-i18n="kb_rag">KB (RAG)</span></div>
        <div class="toggle-item"><label class="switch"><input type="checkbox" id="unlimitedToken"><span class="slider"></span></label> <span data-i18n="unlimited">Unlimited</span></div>
        <div class="toggle-item"><label class="switch"><input type="checkbox" id="webSearch"><span class="slider"></span></label> <span data-i18n="web">Web</span></div>
        <div class="toggle-item"><label class="switch"><input type="checkbox" id="thinkMode"><span class="slider"></span></label> <span data-i18n="think">Think</span></div>
        <div class="toggle-item"><label class="switch"><input type="checkbox" id="autoCompleteToggle" onchange="handleAutoCompleteToggle(this)"><span class="slider"></span></label> <span data-i18n="auto_complete">Auto-Complete</span></div>
    </div>

    <div class="context-bar">
        <span style="color:gray;"><i class="codicon codicon-references"></i> <span data-i18n="context">Context:</span></span>
        <select id="chatScope" class="context-select">
            <option value="auto" data-i18n="ctx_auto">Auto</option>
            <option value="file" data-i18n="ctx_file">File</option>
            <option value="workspace" data-i18n="ctx_workspace">Workspace</option>
            <option value="none" data-i18n="ctx_none">None</option>
        </select>
    </div>

    <div class="chat-history" id="chatHistory">
        <div style="text-align:center; color:gray; font-size:12px; margin-top:20px;">
            <i class="codicon codicon-hubot" style="font-size:28px; margin-bottom:10px; color:var(--accent);"></i><br>
            <span data-i18n="welcome_msg">Welcome to GPU-Heater Coder.</span>
        </div>
    </div>

    <div class="input-area">
        <textarea id="promptInput" data-i18n="ask_ai" placeholder="Ask AI... (Shift+Enter)"></textarea>
        <button class="btn" id="sendBtn" onclick="sendMessage()"><i class="codicon codicon-send"></i> <span data-i18n="btn_send">Send</span></button>
        <button class="btn btn-danger" id="cancelBtn" onclick="cancelStream()" style="display:none;"><i class="codicon codicon-debug-stop"></i> <span data-i18n="btn_stop">Stop</span></button>
    </div>
</div>

<div id="tab-project" class="tab-content">
    <div class="panel-content" id="projectLog" style="background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border);">
        <div style="color:gray;" data-i18n="project_desc">Use the buttons below to analyze the open folder.</div>
    </div>
    <div class="panel-area">
        <button class="btn btn-sec" onclick="inspectWorkspace()"><i class="codicon codicon-search"></i> <span data-i18n="btn_inspect">Inspect Open Folder</span></button>
        <hr style="border-color: var(--border); margin: 15px 0;">
        <label style="font-size:12px; color:gray;" data-i18n="framework_lang">Framework / Language:</label>

        <input type="text" id="scaffoldFramework" list="frameworksList" data-i18n="fw_placeholder" placeholder="Type language or framework" autocomplete="off" />
        <datalist id="frameworksList">
            <option value="React + Node.js (Fullstack)"></option>
            <option value="Next.js (React)"></option>
            <option value="Vue.js + Nuxt"></option>
            <option value="Python FastAPI"></option>
            <option value="Java Spring Boot"></option>
            <option value="C# .NET Core"></option>
        </datalist>

        <textarea id="scaffoldPrompt" rows="3" data-i18n="prompt_scaffold" placeholder="e.g., A simple to-do app"></textarea>
        <button class="btn" onclick="scaffoldProject()"><i class="codicon codicon-package"></i> <span data-i18n="btn_generate">Generate Project</span></button>
    </div>
</div>

<div id="tab-git" class="tab-content">
    <div class="panel-content" id="gitList">
        <div style="color:gray; text-align:center; margin-top:20px;">
            <i class="codicon codicon-info"></i> <span data-i18n="git_desc">Refresh to see Git status.</span>
        </div>
    </div>
    <div class="panel-area">
        <button class="btn btn-sec" onclick="loadGitStatus()"><i class="codicon codicon-sync"></i> <span data-i18n="btn_refresh">Refresh Status</span></button>
        <textarea id="commitMsg" rows="2" data-i18n="prompt_commit" placeholder="Enter commit message..."></textarea>
        <button class="btn" onclick="commitChanges()"><i class="codicon codicon-check"></i> <span data-i18n="btn_commit">Create Commit</span></button>
    </div>
</div>

<script>
    const getApiBase = () => (typeof API_BASE !== 'undefined' ? API_BASE : "http://127.0.0.1:5000");

    const vscode = {
        postMessage: function(msg) {
            if (window.cefQuery) {
                window.cefQuery({
                    request: JSON.stringify(msg),
                    onSuccess: function(response) {},
                    onFailure: function(err, msg) { console.error(msg); }
                });
            } else if (window.vscodeAPI) {
                window.vscodeAPI.postMessage(msg);
            }
        }
    };

    function t(key) {
        const lang = document.getElementById('uiLangSelect').value || 'en';
        if (window.i18nData && window.i18nData[lang] && window.i18nData[lang][key]) {
            return window.i18nData[lang][key];
        }
        if (window.i18nData && window.i18nData['en'] && window.i18nData['en'][key]) {
            return window.i18nData['en'][key];
        }
        return key;
    }

    function translateUI() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            const translation = t(key);

            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                el.placeholder = translation;
            } else if (el.tagName === 'OPTION') {
                el.textContent = translation;
            } else {
                el.textContent = translation;
            }
        });
    }

    function changeLanguage(lang) {
        translateUI();
        vscode.postMessage({ type: 'changeExtLang', lang: lang });
    }

    setTimeout(translateUI, 100);

    function switchTab(tabId, ev) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        if (ev && ev.currentTarget) {
            ev.currentTarget.classList.add('active');
        }
        document.getElementById('tab-' + tabId).classList.add('active');
    }

    function handleAutoCompleteToggle(el) {
        vscode.postMessage({ type: 'toggleAutoComplete', value: el.checked });
    }

    let pendingContextResolve = null;
    window.addEventListener('message', event => {
        const message = event.data;
        if (message.type === 'chatContextResponse' && pendingContextResolve) {
            pendingContextResolve({
                workspacePath: message.workspacePath,
                activeFile: message.activeFile,
                activeFileName: message.activeFileName,
                activeFileContent: message.activeFileContent
            });
            pendingContextResolve = null;
        }
        if (message.type === 'addBotResponse') {
            const chatHistory = document.getElementById('chatHistory');
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-msg markdown-body';
            const title = '<b>💡 ' + message.title + '</b><hr style="border-color:var(--border); margin:5px 0;">';
            botDiv.innerHTML = title + (window.marked ? marked.parse(message.content) : message.content);
            chatHistory.appendChild(botDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    });

    function getVSCodeContext() {
        return new Promise((resolve) => {
            const timer = setTimeout(() => resolve({workspacePath: "", activeFile: "", activeFileName: "", activeFileContent: ""}), 3000);
            pendingContextResolve = (data) => {
                clearTimeout(timer);
                resolve(data);
            };
            vscode.postMessage({ type: 'getChatContext' });
        });
    }

    let currentAbortController = null;
    let isGenerating = false;
    let currentChatId = null;

    document.getElementById('promptInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.shiftKey) {
            e.preventDefault();
            if(!isGenerating) sendMessage();
        }
    });

    async function sendMessage() {
        const input = document.getElementById('promptInput');
        const text = input.value.trim();
        if (!text) return;

        const isCoderMode = document.getElementById('coderMode').checked;
        const isKbEnabled = document.getElementById('kbToggle').checked;
        const isUnlimited = document.getElementById('unlimitedToken').checked;
        const isWebSearch = document.getElementById('webSearch').checked;
        const isThinkMode = document.getElementById('thinkMode').checked;
        const selectedScope = document.getElementById('chatScope').value;
        const chatHistory = document.getElementById('chatHistory');

        const contextData = await getVSCodeContext();

        if (contextData.workspacePath && selectedScope !== 'none') {
            try {
                await fetch(getApiBase() + '/api/coder/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ path: contextData.workspacePath })
                });
            } catch(e) {}
        }

        const userDiv = document.createElement('div');
        userDiv.className = 'message user-msg';
        userDiv.textContent = text;
        chatHistory.appendChild(userDiv);
        input.value = '';
        chatHistory.scrollTop = chatHistory.scrollHeight;

        const botDiv = document.createElement('div');
        botDiv.className = 'message bot-msg markdown-body';
        botDiv.innerHTML = '<span style="color:gray; font-style:italic;"><i class="codicon codicon-loading codicon-spin"></i> ' + t('status_thinking') + '</span>';
        chatHistory.appendChild(botDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;

        isGenerating = true;
        document.getElementById('sendBtn').style.display = 'none';
        document.getElementById('cancelBtn').style.display = 'flex';

        const formData = new FormData();
        formData.append("prompt", text);
        formData.append("action", "analyze");
        formData.append("coderMode", isCoderMode);
        formData.append("useKnowledgeBase", isKbEnabled);
        formData.append("unlimitedToken", isUnlimited);
        formData.append("webSearch", isWebSearch);
        formData.append("thinking", isThinkMode);
        formData.append("contextScope", selectedScope);

        if (selectedScope === 'auto' || selectedScope === 'workspace') {
            formData.append("workspacePath", contextData.workspacePath || "");
        }
        if (selectedScope === 'auto' || selectedScope === 'file') {
            formData.append("activeFile", contextData.activeFile || "");
            formData.append("activeFileContent", contextData.activeFileContent || "");
        }

        if (currentChatId) formData.append("chatId", currentChatId);

        currentAbortController = new AbortController();
        let fullText = "";

        try {
            const res = await fetch(getApiBase() + '/api/generate_stream', { method: 'POST', body: formData, signal: currentAbortController.signal });
            const reader = res.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";
            botDiv.innerHTML = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split(/\r?\n/);
                buffer = lines.pop();

                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('data: ')) {
                        const dataStr = line.substring(6).trim();
                        if (dataStr === '[DONE]') continue;
                        if (!dataStr) continue;
                        try {
                            const data = JSON.parse(dataStr);
                            if (data.chat_id) currentChatId = data.chat_id;
                            if (data.chunk) {
                                fullText += data.chunk;
                                let renderText = fullText.replace(/<think>[\s\S]*?<\/think>/g, '').replace(/<think>[\s\S]*/g, '');
                                if (window.marked) {
                                    botDiv.innerHTML = marked.parse(renderText);
                                } else {
                                    botDiv.textContent = renderText;
                                }
                            }
                        } catch(e) {}
                    }
                }
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
        } catch(err) {
            if (err.name === 'AbortError') {
                fullText += "\n\n" + t('process_stopped');
                botDiv.innerHTML = window.marked ? marked.parse(fullText) : fullText;
            } else {
                botDiv.innerHTML = "<span style='color:red;'>" + t('err_conn_unreachable') + "</span>";
            }
        } finally {
            isGenerating = false;
            document.getElementById('sendBtn').style.display = 'flex';
            document.getElementById('cancelBtn').style.display = 'none';
        }
    }

    function cancelStream() { if (currentAbortController) currentAbortController.abort(); }

    async function inspectWorkspace() {
        const contextData = await getVSCodeContext();
        const path = contextData.workspacePath;
        const logDiv = document.getElementById('projectLog');
        if (!path) {
            logDiv.innerHTML = "<span style='color:red;'><i class='codicon codicon-warning'></i> " + t('err_open_folder') + "</span>";
            return;
        }
        logDiv.innerHTML = "<i class='codicon codicon-loading codicon-spin'></i> " + t('status_scanning');
        try {
            const res = await fetch(getApiBase() + '/api/coder/inspect', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ path: path })
            });
            const data = await res.json();
            if (data.success) {
                logDiv.innerHTML = "<span style='color:var(--accent);'><i class='codicon codicon-check'></i> " + t('scan_success') + "</span><br><br><pre style='font-size:11px; white-space:pre-wrap;'>" + data.data + "</pre>";
            } else {
                logDiv.innerHTML = "<span style='color:red;'><i class='codicon codicon-error'></i> " + data.error + "</span>";
            }
        } catch(e) { logDiv.innerHTML = "<i class='codicon codicon-plug'></i> " + t('err_conn_unreachable'); }
    }

    async function scaffoldProject() {
        const contextData = await getVSCodeContext();
        const path = contextData.workspacePath;
        const isKbEnabled = document.getElementById('kbToggle').checked;
        const logDiv = document.getElementById('projectLog');
        if (!path) {
            logDiv.innerHTML = "<span style='color:red;'><i class='codicon codicon-warning'></i> " + t('err_open_empty_folder') + "</span>";
            return;
        }

        await fetch(getApiBase() + '/api/coder/create', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path: path })
        });

        const prompt = document.getElementById('scaffoldPrompt').value;
        const framework = document.getElementById('scaffoldFramework').value;
        if(!prompt || !framework) return;

        logDiv.innerHTML = "<b><i class='codicon codicon-gear'></i> " + t('project_gen_start') + "</b><br><br>";

        try {
            const res = await fetch(getApiBase() + '/api/coder/scaffold_stream', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ prompt, framework, use_knowledge_base: isKbEnabled })
            });
            const reader = res.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split(/\r?\n/);
                buffer = lines.pop();

                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('data: ')) {
                        const dataStr = line.substring(6).trim();
                        if (dataStr === '[DONE]') continue;
                        if (!dataStr) continue;
                        try {
                            const data = JSON.parse(dataStr);
                            if (data.status) {
                                logDiv.innerHTML += '<div style="color:var(--accent); margin-bottom:4px;"><i class="codicon codicon-chevron-right"></i> ' + data.status + '</div>';
                                logDiv.scrollTop = logDiv.scrollHeight;
                            }
                        } catch(e) {}
                    }
                }
            }
        } catch(e) { logDiv.innerHTML += "<br><span style='color:red;'><i class='codicon codicon-error'></i> " + t('err_occurred') + "</span>"; }
    }

    async function loadGitStatus() {
        const contextData = await getVSCodeContext();
        const path = contextData.workspacePath;
        const listDiv = document.getElementById('gitList');
        if (!path) {
            listDiv.innerHTML = "<span style='color:red;'><i class='codicon codicon-warning'></i> " + t('err_no_open_folder') + "</span>";
            return;
        }

        await fetch(getApiBase() + '/api/coder/create', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path: path })
        });

        listDiv.innerHTML = "<i class='codicon codicon-loading codicon-spin'></i> " + t('status_fetching_git');
        try {
            const res = await fetch(getApiBase() + '/api/coder/git/status');
            const data = await res.json();

            if (data.success) {
                if (data.changes && data.changes.length > 0) {
                    let html = "";
                    data.changes.forEach(c => {
                        html += '<div class="git-item"><span class="git-status-code">' + c.status + '</span> <span>' + c.file + '</span></div>';
                    });
                    listDiv.innerHTML = html;
                } else {
                    listDiv.innerHTML = "<i class='codicon codicon-check'></i> " + t('git_clean');
                }
            } else {
                listDiv.innerHTML = "<span style='color:red;'><i class='codicon codicon-error'></i> " + data.error + "</span>";
            }
        } catch(e) { listDiv.innerHTML = "<i class='codicon codicon-plug'></i> " + t('err_fetch_git'); }
    }

    async function commitChanges() {
        const contextData = await getVSCodeContext();
        const path = contextData.workspacePath;
        if (!path) return;

        const msg = document.getElementById('commitMsg').value;
        if (!msg) { alert(t('err_empty_commit')); return; }

        document.getElementById('gitList').innerHTML = "<i class='codicon codicon-loading codicon-spin'></i> " + t('status_committing');
        try {
            const res = await fetch(getApiBase() + '/api/coder/git/commit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: msg, files: [] })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('commitMsg').value = '';
                loadGitStatus();
            } else {
                document.getElementById('gitList').innerHTML = "<span style='color:red;'><i class='codicon codicon-error'></i> " + t('commit_error') + "<br>" + data.error + "</span>";
            }
        } catch(e) { document.getElementById('gitList').innerHTML = "<i class='codicon codicon-plug'></i> " + t('err_commit_fail'); }
    }
</script>
</body>
</html>
